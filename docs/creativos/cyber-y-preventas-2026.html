  .marco > .placa { transform: scale(0.277778); transform-origin: top left; }

  /* ---------- Las placas (tamaño real) ---------- */

  .placa::after { width: 900px; height: 900px; left: -420px; bottom: -380px; background: radial-gradient(circle, rgba(246,149,10,0.17), transparent 65%); }

  .lista { display: flex; flex-direction: column; }

  .lista .curso { display: flex; flex-direction: column; gap: 2px; }

  .lista .nuevo { color: var(--verdeClaro); font-family: var(--display); font-size: 50px; }
  .lista .nuevo.regalo { color: var(--naranja); }
  .story .lista .fila { padding: 14px 0; }

  /* Placas con mucho texto: todo un poco más compacto para que el pie no se salga */

  .denso .titulo { font-size: 108px; }

      <span class="antes"><span class="rotulo">Desde el 18/11</span><span class="tachado">$18.000</span></span>
      <span class="ahora"><span class="monto">$10.000</span><small>precio de preventa</small></span>

// ---------- Armado de la galería ----------
const FORMATOS = [["post", "Post 1080×1350"], ["story", "Historia 1080×1920"]];
const ambos = (prefijo, titulo, fn) => FORMATOS.map(([f, nombreFormato]) => ({
  id: `${prefijo}-${f}`, archivo: `${prefijo}-${f === "post" ? "post" : "historia"}`,
  titulo: `${titulo} · ${nombreFormato}`, vertical: f === "story", html: fn(f),
}));

const SECCIONES = [
  {
    titulo: 'Cyber <span class="srv">SRV</span> · 2 al 4 de noviembre',
    texto: "Anuncio general, lista de precios y una placa por curso. Redes y Scratch muestran también su precio de preventa de fuera del Cyber.",
    piezas: [
      ...ambos("cyber-general", "Anuncio general", cyberGeneral),
      ...ambos("cyber-lista", "Lista de precios", cyberLista),
      ...CURSOS.flatMap((c) => ambos(`cyber-${c.key}`, c.corto, (f) => cyberCurso(c, f))),
    ],
  },
  {
    titulo: 'Preventa Redes, Linux y <span class="srv">AWS</span>',
    texto: "Para la campaña de AWS (link: wearesrv.com/redes/inscripcion). La de sumas muestra los cursos que se agregan a precio de campaña.",
    piezas: [
      ...ambos("redes-preventa", "Preventa", redesPreventa),
      ...ambos("redes-sumas", "Sumá cursos", redesSumas),
    ],
  },
  {
    titulo: 'Preventa Scratch para <span class="srv">Chicos</span>',
    texto: "Hasta el 17/11; las clases se habilitan el 18/11.",
    piezas: ambos("scratch-preventa", "Preventa", scratchPreventa),
  },
];

const TODAS = SECCIONES.flatMap((s) => s.piezas);
document.getElementById("todos").textContent = `⬇ Descargar todos (${TODAS.length} PNG)`;

document.getElementById("secciones").innerHTML = SECCIONES.map((s, i) => `
  <section class="seccion">
    <h2>${s.titulo}</h2>
    <p class="sub">${s.texto}</p>
    <div class="acciones"><button type="button" class="secundario" data-seccion="${i}">⬇ Descargar esta sección (${s.piezas.length} PNG)</button></div>
    <div class="galeria">${s.piezas.map((p) => `
      <div class="pieza">
        <h3>${p.titulo}</h3>
        <div class="marco${p.vertical ? " vertical" : ""}">${p.html}</div>
        <button type="button" data-id="${p.id}" data-archivo="${p.archivo}">⬇ Descargar PNG</button>
      </div>`).join("")}
    </div>
  </section>`).join("");

const estado = document.getElementById("estado");

async function descargar(id, archivo) {
  await document.fonts.ready;
  const original = document.getElementById(id);
  // Se captura un clon a tamaño real, fuera del marco escalado
  const refugio = document.createElement("div");
  refugio.style.cssText = "position:fixed;left:-20000px;top:0;";
  const clon = original.cloneNode(true);
  refugio.appendChild(clon);
  document.body.appendChild(refugio);
  try {
    const canvas = await html2canvas(clon, { backgroundColor: "#000000", scale: 1, logging: false, useCORS: true });
    const a = document.createElement("a");
    a.href = canvas.toDataURL("image/png");
    a.download = archivo + ".png";
    a.click();
  } finally {
    refugio.remove();
  }
}

async function descargarVarias(piezas) {
  for (let i = 0; i < piezas.length; i++) {
    estado.textContent = `Generando ${i + 1} de ${piezas.length}: ${piezas[i].archivo}.png…`;
    await descargar(piezas[i].id, piezas[i].archivo);
    await new Promise((r) => setTimeout(r, 400));
  }
  estado.textContent = `Listo: se descargaron ${piezas.length} placas.`;
}

document.body.addEventListener("click", async (e) => {
  const una = e.target.closest("button[data-id]");
  const seccion = e.target.closest("button[data-seccion]");
  if (una) {
    estado.textContent = "Generando " + una.dataset.archivo + ".png…";
    await descargar(una.dataset.id, una.dataset.archivo);
    estado.textContent = "Listo: " + una.dataset.archivo + ".png";
  } else if (seccion) {
    await descargarVarias(SECCIONES[Number(seccion.dataset.seccion)].piezas);
  } else if (e.target.id === "todos") {
    await descargarVarias(TODAS);
  }
});
</script>
